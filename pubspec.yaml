name: mingtu_ai
description: "明途 AI v0.2：面向视障人士的校园出行辅助演示原型（盲人优先，本地优先，云端按需）。"
publish_to: "none"
version: 0.7.0+8

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  flutter_tts: ^4.2.5
  geolocator: ^13.0.2
  speech_to_text: ^7.5.0
  ultralytics_yolo: ^0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  # Core tests are pure Dart and import package:test so they can also be
  # verified with `dart test` in a standalone harness (see scripts/run_tests.sh).
  test: ^1.24.0

flutter:
  uses-material-design: true
  assets:
    # Bundled YOLO11n int8 TFLite (official Ultralytics
    # release; see README "YOLO 模型" and tool/fetch_model.sh).
    # The file is fetched and SHA256-verified by
    # tool/fetch_model.sh -- run it before building.
    - assets/models/yolo11n.tflite
